# 로그가 무한히 쌓여 EC2 디스크를 채우지 않게 한다 (KAN-68).
#
# 기본 json-file 드라이버는 크기 제한이 없어서, 한 번 시끄러워진 컨테이너가 남은
# 디스크를 다 먹는다. 그 상태에서는 배포도 DB 쓰기도 함께 막힌다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lab_calendar
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    # Shares a 2GB host with the JVM, so keep InnoDB small and skip the
    # performance schema (~400MB saved); 10 users never need either.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_as_cs
      - --innodb-buffer-pool-size=256M
      - --performance-schema=OFF
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - internal

  backend:
    image: ghcr.io/lab-calendar/lab-calendar-backend:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/lab_calendar?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # 공용 비밀번호 인증 (KAN-34). 셋 중 하나라도 비면 앱이 기동을 거부한다.
      AUTH_EDITOR_PASSWORD_HASH: ${AUTH_EDITOR_PASSWORD_HASH}
      AUTH_VIEWER_PASSWORD_HASH: ${AUTH_VIEWER_PASSWORD_HASH}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
      # 구글 시트 자동 동기화 (KAN-88). 비워 두면 꺼진 채로 돈다 — 켜려면 셋 다 필요하고,
      # 하나라도 비면 앱이 기동을 거부한다. 키는 base64 로 넣는다(README 참고).
      SHEETS_SYNC_ENABLED: ${SHEETS_SYNC_ENABLED:-false}
      SHEETS_SPREADSHEET_ID: ${SHEETS_SPREADSHEET_ID:-}
      SHEETS_CREDENTIALS_JSON: ${SHEETS_CREDENTIALS_JSON:-}
      # 주기와 안전장치 기준. 비워 두면 앱의 기본값(매시 정각, 20건·50%)을 쓴다.
      # README 가 이 값들을 바꿀 수 있다고 적어 두었으므로 여기서도 넘겨준다.
      SHEETS_SYNC_CRON: ${SHEETS_SYNC_CRON:-0 0 * * * *}
      LAB_CALENDAR_SHEETS_MAX_REMOVALS_PER_MONTH: ${SHEETS_MAX_REMOVALS_PER_MONTH:-20}
      LAB_CALENDAR_SHEETS_MAX_REMOVAL_RATIO: ${SHEETS_MAX_REMOVAL_RATIO:-0.5}
    expose:
      - "8080"
    # DB 연결까지 확인한다. 프로세스가 살아 있어도 DB 가 끊기면 unhealthy 다.
    # 기동이 느릴 수 있어 start_period 를 넉넉히 준다 — 그동안의 실패는 세지 않는다.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging: *default-logging
    networks:
      - internal

  nginx:
    image: ghcr.io/lab-calendar/lab-calendar-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    logging: *default-logging
    networks:
      - internal

  certbot:
    image: certbot/certbot
    # 갱신 루프라 멈추면 인증서가 조용히 만료된다. 다른 서비스와 같은 정책을 준다.
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >
      /bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'

networks:
  internal:

volumes:
  mysql-data:
  certbot-etc:
  certbot-www:
