# 로그가 무한히 쌓여 EC2 디스크를 채우지 않게 한다 (KAN-68).
#
# 기본 json-file 드라이버는 크기 제한이 없어서, 한 번 시끄러워진 컨테이너가 남은
# 디스크를 다 먹는다. 그 상태에서는 배포도 DB 쓰기도 함께 막힌다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    image: ghcr.io/lab-calendar/lab-calendar-backend:latest
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # 공용 비밀번호 인증 (KAN-34). 셋 중 하나라도 비면 앱이 기동을 거부한다.
      AUTH_EDITOR_PASSWORD_HASH: ${AUTH_EDITOR_PASSWORD_HASH}
      AUTH_VIEWER_PASSWORD_HASH: ${AUTH_VIEWER_PASSWORD_HASH}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
    expose:
      - "8080"
    # DB 연결까지 확인한다. 프로세스가 살아 있어도 DB 가 끊기면 unhealthy 다.
    # 기동이 느릴 수 있어 start_period 를 넉넉히 준다 — 그동안의 실패는 세지 않는다.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging: *default-logging
    networks:
      - internal

  nginx:
    image: ghcr.io/lab-calendar/lab-calendar-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    logging: *default-logging
    networks:
      - internal

  certbot:
    image: certbot/certbot
    # 갱신 루프라 멈추면 인증서가 조용히 만료된다. 다른 서비스와 같은 정책을 준다.
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >
      /bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'

networks:
  internal:

volumes:
  certbot-etc:
  certbot-www:
