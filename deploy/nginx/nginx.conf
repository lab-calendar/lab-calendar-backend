server {
    listen 80;
    server_name lab-calendar.cloud www.lab-calendar.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name lab-calendar.cloud www.lab-calendar.cloud;

    ssl_certificate /etc/letsencrypt/live/lab-calendar.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lab-calendar.cloud/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 해시가 박힌 파일들. 내용이 바뀌면 이름이 바뀌므로 오래 캐시해도 낡지 않는다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 은 매번 물어보게 한다 (KAN-90).
    #
    # 이름이 고정된 유일한 파일이라, 브라우저가 이것을 캐시하면 그 안에 적힌 옛
    # 번들을 계속 쓰게 된다. 서버에 카테고리가 하나 늘었는데 화면 코드는 그것을
    # 모르는 상태 — 실제로 '개인 일정'을 더했을 때 그래서 폼이 내려앉았다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
