spring:
  datasource:
    url: ${MIGRATION_TEST_URL:jdbc:h2:mem:kan28;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    driver-class-name: ${MIGRATION_TEST_DRIVER:org.h2.Driver}
    username: ${MIGRATION_TEST_USER:sa}
    password: ${MIGRATION_TEST_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: true
    validate-migration-naming: true
    placeholders:
      tableOptions: "${MIGRATION_TEST_TABLE_OPTIONS:}"
