spring:
  application:
    name: lab-calendar-backend
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: true
    validate-migration-naming: true
    placeholders:
      tableOptions: "ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_as_cs"

server:
  port: 8080

springdoc:
  override-with-generic-response: false
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    disable-swagger-default-url: true

logging:
  level:
    org.hibernate.SQL: debug

# 공용 비밀번호 인증 (KAN-34). 값은 환경에서 주입하며 저장소에 두지 않는다.
lab-calendar:
  auth:
    editor-password-hash: ${AUTH_EDITOR_PASSWORD_HASH:}
    viewer-password-hash: ${AUTH_VIEWER_PASSWORD_HASH:}
    token-secret: ${AUTH_TOKEN_SECRET:}
    token-ttl: PT12H
    # 로컬은 평문 HTTP 라 Secure 쿠키가 전달되지 않는다. 운영 프로파일에서 켠다.
    cookie-secure: false
