spring:
  application:
    name: lab-calendar-backend
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: true
    validate-migration-naming: true
    placeholders:
      tableOptions: "ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_as_cs"

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
